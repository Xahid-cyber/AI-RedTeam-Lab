name: AI Security Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  promptfoo-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Promptfoo
        run: npm install -g promptfoo@0.122.2

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5

      - name: Pull Qwen model
        run: ollama pull qwen3:1.7b

      - name: Start Northwind FastAPI app
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "FastAPI did not become ready"
          cat /tmp/uvicorn.log
          exit 1

      - name: Run Promptfoo security regression
        run: |
          mkdir -p results/promptfoo-ci
          promptfoo eval -c promptfooconfig-security.yaml --max-concurrency 1 \
            --output results/promptfoo-ci/security-results.json \
            --output results/promptfoo-ci/security-results.html

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-security-results
          path: results/promptfoo-ci/
